[build-system]
requires = ["setuptools>61"]
build-backend = "setuptools.build_meta"


[project]
name = "ryanhaylin"
description = "HTTP/2 client for Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

authors = [
    {name = "Ryan"}
]

dependencies = [
    "httpx[http2]"
]

[tool.setuptools.packages.find]
where = ['src']










